<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · NOCHIs</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth"><a class="brand" href="index.html">NOCHIs</a><h1>Welcome back</h1><form id="form"><label>Email<input type="email" id="email" required></label><label>Password<input type="password" id="password" required></label><button class="btn">Log in</button><p id="message"></p></form><p>New student? <a href="register.html">Create an account</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script>form.onsubmit=async e=>{e.preventDefault();try{await loginUser(email.value,password.value);location.href='dashboard.html'}catch(err){message.textContent=err.message}}</script></body></html>
