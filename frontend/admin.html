<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner dashboard · NOCHIs</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="brand" href="index.html">NOCHIs <span>Owner dashboard</span></a><nav><a href="dashboard.html">Student portal</a></nav></header><main class="section"><h1>Owner dashboard</h1><div id="stats" class="cards"></div><h2>Pending room applications</h2><div id="apps"></div><p id="message"></p></main><script src="js/config.js"></script><script>async function load(){try{let s=await api('/api/admin/overview');stats.innerHTML=Object.entries(s).map(([k,v])=>`<article><h3>${k.replaceAll('_',' ')}</h3><b>${k==='recorded_payments'?'K':''}${v}</b></article>`).join('');let rows=await api('/api/admin/applications');apps.innerHTML=rows.map(a=>`<article><b>${a.profiles?.full_name||a.student_id}</b> · Room ${a.requested_room} · ${a.status}<p>${a.profiles?.phone||''}</p>${a.status==='pending'?`<button class="btn" onclick="review('${a.id}','approve')">Approve</button> <button class="btn light" onclick="review('${a.id}','reject')">Reject</button>`:''}</article>`).join('')||'No applications'}catch(e){message.textContent=e.message+' (Owner account required.)'}}async function review(id,decision){try{await api(`/api/admin/applications/${id}/review?decision=${decision}`,{method:'POST'});load()}catch(e){message.textContent=e.message}}load();</script></body></html>
