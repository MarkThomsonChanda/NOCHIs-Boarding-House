<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room swap · NOCHIs</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="brand" href="dashboard.html">NOCHIs <span>Room swap</span></a><nav><a href="dashboard.html">Dashboard</a></nav></header><main class="auth"><h1>Request a room swap</h1><form id="form"><label>Room number you want<input type="number" min="1" max="28" id="requested_room" required></label><label>Reason<textarea id="reason" required></textarea></label><button class="btn">Send request</button><p id="message"></p></form></main><script src="js/config.js"></script><script>form.onsubmit=async e=>{e.preventDefault();try{await api('/api/swaps',{method:'POST',body:JSON.stringify({requested_room:Number(requested_room.value),reason:reason.value})});message.textContent='Swap request sent for owner review.'}catch(e){message.textContent=e.message}}</script></body></html>
