<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register · NOCHIs</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth"><a class="brand" href="index.html">NOCHIs</a><h1>Create student account</h1><form id="form"><label>Full name<input id="name" required></label><label>Email<input type="email" id="email" required></label><label>Password<input type="password" id="password" minlength="8" required></label><button class="btn">Register</button><p id="message"></p></form><p>Already registered? <a href="login.html">Log in</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script>form.onsubmit=async e=>{e.preventDefault();try{await registerUser(email.value,password.value,name.value);message.textContent='Account created. Check your email if confirmation is enabled, then log in.'}catch(err){message.textContent=err.message}}</script></body></html>
