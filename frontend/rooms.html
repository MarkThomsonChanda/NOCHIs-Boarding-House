<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rooms · NOCHIs</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="brand" href="dashboard.html">NOCHIs <span>Rooms</span></a><nav><a href="dashboard.html">Dashboard</a><a href="payments.html">Payments</a><a href="profile.html">Profile</a></nav></header><main class="section"><h1>Available rooms</h1><p>Select a room to submit an application. Owner approval is required.</p><div id="rooms" class="cards"></div><p id="message"></p></main><script src="js/config.js"></script><script>async function load(){try{const data=await api('/api/rooms');rooms.innerHTML=data.map(r=>`<article><h3>Room ${r.room_number}</h3><p>K${r.price_kwacha} per student</p><p>${r.available_spaces} of ${r.capacity} spaces available</p><button class="btn" ${r.available_spaces===0?'disabled':''} onclick="apply(${r.room_number})">Request room</button></article>`).join('')}catch(e){message.textContent=e.message}}async function apply(n){try{await api('/api/applications',{method:'POST',body:JSON.stringify({requested_room:n})});message.textContent='Application submitted. The owners will review it.';load()}catch(e){message.textContent=e.message}}load();</script></body></html>
