<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments · NOCHIs</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="brand" href="dashboard.html">NOCHIs <span>Payments</span></a><nav><a href="dashboard.html">Dashboard</a><a href="profile.html">Profile</a></nav></header><main class="section"><h1>Payment history</h1><p>Payment records entered by the boarding house owner appear here.</p><div id="list"></div><p id="message"></p></main><script src="js/config.js"></script><script>api('/api/payments').then(rows=>list.innerHTML=rows.length?rows.map(p=>`<article><b>K${p.amount_kwacha}</b> · ${p.payment_date} · ${p.status}<p>${p.payment_method||''} ${p.reference||''}</p></article>`).join(''):'No payments recorded yet.').catch(e=>message.textContent=e.message)</script></body></html>
