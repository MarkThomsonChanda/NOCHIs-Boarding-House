<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile · NOCHIs</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="brand" href="dashboard.html">NOCHIs <span>My profile</span></a><nav><a href="dashboard.html">Dashboard</a></nav></header><main class="auth"><h1>Personal information</h1><form id="form"><label>Full name<input id="full_name"></label><label>NRC number<input id="nrc_number"></label><label>Phone number<input id="phone"></label><label>Residential address<textarea id="residential_address"></textarea></label><label>Parent/guardian name<input id="guardian_name"></label><label>Parent/guardian phone<input id="guardian_phone"></label><label>Profile picture URL<input id="profile_picture_url" placeholder="Optional image URL"></label><button class="btn">Save profile</button><p id="message"></p></form></main><script src="js/config.js"></script><script>const fields=['full_name','nrc_number','phone','residential_address','guardian_name','guardian_phone','profile_picture_url'];api('/api/me').then(p=>fields.forEach(k=>document.getElementById(k).value=p[k]||'')).catch(e=>message.textContent=e.message);form.onsubmit=async e=>{e.preventDefault();let data={};fields.forEach(k=>data[k]=document.getElementById(k).value);try{await api('/api/me',{method:'PUT',body:JSON.stringify(data)});message.textContent='Profile saved.'}catch(e){message.textContent=e.message}}</script></body></html>
